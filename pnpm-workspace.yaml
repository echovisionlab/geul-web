  '@tiptap/pm': 3.30.1
  '@tiptap/react': 3.30.1
  '@xmldom/xmldom': 0.8.13
  '@tootallnate/once': 3.0.1
  brace-expansion@1: 1.1.18
  brace-expansion@5: 5.0.9
  dompurify: 3.4.13
  fast-uri: 3.1.5
  immer: 11.1.10
  json-schema-migrate>ajv: 6.14.0
  lodash: 4.18.1
  next: 16.3.1
  postcss: 8.5.26
  protobufjs@7: 7.5.6
