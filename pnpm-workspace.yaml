allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js-pure: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

peerDependencyRules:
  allowedVersions:
    '@mantine/core': 9.5.1
    '@mantine/hooks': 9.5.1
  ignoreMissing:
    - '@floating-ui/dom'
    - '@mantine/utils'

packageExtensions:
  '@mantine/hooks@9.5.1':
    peerDependencies:
      react-dom: ^19.2.0
  '@maplibre/maplibre-gl-style-spec@26.2.1':
    dependencies:
      '@types/geojson': 7946.0.16
  '@storybook/builder-webpack5@10.5.8':
    dependencies:
      typescript: workspace:*
  '@storybook/nextjs@10.5.8':
    dependencies:
      typescript: workspace:*
  '@storybook/preset-react-webpack@10.5.8':
    dependencies:
      typescript: workspace:*
  '@storybook/react@10.5.8':
    dependencies:
      typescript: workspace:*
  'eslint-config-mantine@4.0.3':
    dependencies:
      typescript: npm:@typescript/typescript6@6.0.2
  '@storybook/react-docgen-typescript-plugin@1.0.6--canary.9.0c3f3b7.0':
    dependencies:
      typescript: workspace:*
  'fork-ts-checker-webpack-plugin@9.1.0':
    dependencies:
      typescript: workspace:*
  'react-docgen-typescript@2.4.0':
    dependencies:
      typescript: workspace:*

patchedDependencies:
