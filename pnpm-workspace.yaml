  - 'tooling/*'

blockExoticSubdeps: false
injectWorkspacePackages: true
minimumReleaseAgeExclude:
  - '@echovisionlab/*'
  - '@tabler/icons-react@3.49.0'
  - '@tabler/icons@3.49.0'
  - react-aria-components@1.22.1
  - react-aria@3.53.1
  - '@storybook/addon-docs@10.6.3'

overrides:
  '@babel/core': 8.0.7
  '@protobufjs/utf8': 1.1.2
  '@types/dom-mediacapture-transform>@types/dom-webcodecs': 0.1.13
  '@tiptap/core': 3.32.0
  '@tiptap/extension-bold': 3.32.0
  '@tiptap/extension-bubble-menu': 3.32.0
  '@tiptap/extension-code': 3.32.0
  '@tiptap/extension-emoji': 3.32.0
  '@tiptap/extension-floating-menu': 3.32.0
  '@tiptap/extension-horizontal-rule': 3.32.0
  '@tiptap/extension-italic': 3.32.0
  '@tiptap/extension-paragraph': 3.32.0
  '@tiptap/extension-strike': 3.32.0
  '@tiptap/extension-text': 3.32.0
  '@tiptap/extension-underline': 3.32.0
  '@tiptap/extensions': 3.32.0
  '@tiptap/pm': 3.32.0
  '@tiptap/react': 3.32.0
  '@tiptap/suggestion': 3.32.0
  '@xmldom/xmldom': 0.8.15
  '@tootallnate/once': 3.0.1
  brace-expansion@1: 1.1.21
  brace-expansion@5: 5.0.12
  dompurify: 3.4.17
  fast-uri: 3.1.9
  immer: 11.1.21
  json-schema-migrate>ajv: 6.15.0
  lodash: 4.18.1
  next: 16.4.3
  postcss: 8.5.31
  protobufjs@7: 7.6.6
  protobufjs@8: 8.8.1
  prosemirror-model: 1.25.12
  prosemirror-transform: 1.12.2
  prosemirror-view: 1.42.8
  uuid: 11.1.1
  vite: 8.3.3
  ws: 8.21.3
  'satori>fflate': 0.7.5
  source-map-js@1: 1.2.2
  qs@6: 6.16.1
  postcss-selector-parser@7: 7.1.7
  pbkdf2: 3.1.7
  js-yaml: 4.3.2
  webapi-parser>ajv: 6.15.0
  '@storybook/builder-webpack5@10.6.3>typescript': workspace:*
  '@storybook/nextjs@10.6.3>typescript': workspace:*
  '@storybook/preset-react-webpack@10.6.3>typescript': workspace:*
  '@storybook/react@10.6.3>typescript': workspace:*
  '@storybook/react-docgen-typescript-plugin@1.0.6--canary.9.0c3f3b7.0>typescript': workspace:*
  'fork-ts-checker-webpack-plugin@9.1.0>typescript': workspace:*
  'react-docgen-typescript@2.4.0>typescript': workspace:*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js-pure: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

peerDependencyRules:
  allowedVersions:
    '@mantine/core': 9.7.3
    '@mantine/hooks': 9.7.3
  ignoreMissing:
    - '@floating-ui/dom'
    - '@mantine/utils'

packageExtensions:
  'react-aria@3.53.1':
    dependencies:
      dom-accessibility-api: 0.6.3
  '@mantine/hooks@9.7.3':
    peerDependencies:
      react-dom: ^19.2.0
  '@maplibre/maplibre-gl-style-spec@26.4.4':
    dependencies:
      '@types/geojson': 7946.0.16
  '@storybook/builder-webpack5@10.6.3':
    dependencies:
      typescript: workspace:*
  '@storybook/nextjs@10.6.3':
    dependencies:
      typescript: workspace:*
  '@storybook/preset-react-webpack@10.6.3':
    dependencies:
      typescript: workspace:*
  '@storybook/react@10.6.3':
    dependencies:
      typescript: workspace:*
  'eslint-config-mantine@4.0.3':
    dependencies:
      typescript: npm:@typescript/typescript6@6.0.2
  '@storybook/react-docgen-typescript-plugin@1.0.6--canary.9.0c3f3b7.0':
    dependencies:
      typescript: workspace:*
  'fork-ts-checker-webpack-plugin@9.1.0':
    dependencies:
      typescript: workspace:*
  'react-docgen-typescript@2.4.0':
    dependencies:
      typescript: workspace:*

patchedDependencies:
  # Published React declarations refer to a private namespace without Editor.
  # Use the imported core Editor type in both ESM/CJS declarations; no runtime changes.
  '@tiptap/react@3.32.0': patches/@tiptap__react@3.32.0.patch
  '@testing-library/jest-dom@7.0.1': patches/@testing-library__jest-dom@7.0.1.patch
  '@dnd-kit/core@6.3.1': patches/@dnd-kit__core@6.3.1.patch
  '@dnd-kit/sortable@10.0.0': patches/@dnd-kit__sortable@10.0.0.patch
  '@maplibre/maplibre-gl-style-spec@26.4.4': patches/@maplibre__maplibre-gl-style-spec@26.4.4.patch
  '@monaco-editor/react@4.7.0': patches/@monaco-editor__react@4.7.0.patch
  '@types/dom-webcodecs@0.1.13': patches/@types__dom-webcodecs@0.1.13.patch
  ast-types@0.16.1: patches/ast-types@0.16.1.patch
  simple-icons@16.35.0: patches/simple-icons@16.35.0.patch
  react-aria@3.53.1: patches/react-aria@3.53.1.patch
  '@storybook/addon-docs@10.6.3': patches/@storybook__addon-docs@10.6.3.patch
