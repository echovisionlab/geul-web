name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '.release-please-manifest.json'
      - 'CHANGELOG.md'
      - 'release-please-config.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PNPM_VERSION: 12.9.1
  OATHKEEPER_URL: http://localhost:8000
  KRATOS_URL: http://localhost:4433
  KRATOS_ADMIN_URL: http://localhost:4434
  HYDRA_ADMIN_URL: http://localhost:4445
  MCP_OAUTH_ISSUER_URL: http://sso.localhost:4444
  SITE_ORIGIN: http://localhost:3000
  SESSION_COOKIE_NAME: site_session
  DRAFT_SECRET: build-time-placeholder-secret123
  ENCRYPTION_SECRET: build-time-placeholder-secret123
  HOST: localhost

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.classify.outputs.run_full }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Classify pull request changes
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          run_full=true

          if [[ "${HEAD_REF}" = release-please--* ]] &&
             [ -n "${BASE_SHA}" ] &&
             [ -n "${HEAD_SHA}" ]; then
            changed_files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
            metadata_only=true
            [ -n "${changed_files}" ] || metadata_only=false

            while IFS= read -r path; do
              case "${path}" in
                .release-please-manifest.json|CHANGELOG.md|package.json) ;;
                *) metadata_only=false ;;
              esac
            done <<< "${changed_files}"

            if [ "${metadata_only}" = "true" ]; then
              if ! python3 - "${BASE_SHA}" "${HEAD_SHA}" <<'PY'
          import json
          import subprocess
          import sys

          base_sha, head_sha = sys.argv[1:]

          def read_package(revision: str) -> tuple[str, dict]:
              raw = subprocess.check_output(
                  ["git", "show", f"{revision}:package.json"], text=True
              )
              package = json.loads(raw)
              version = package.pop("version", None)
              if not isinstance(version, str):
                  raise SystemExit(1)
              return version, package

          base_version, base_package = read_package(base_sha)
          head_version, head_package = read_package(head_sha)

          def read_manifest(revision: str) -> dict:
              raw = subprocess.check_output(
                  ["git", "show", f"{revision}:.release-please-manifest.json"], text=True
              )
              manifest = json.loads(raw)
              if not isinstance(manifest, dict):
                  raise SystemExit(1)
              return manifest

          base_manifest = read_manifest(base_sha)
          head_manifest = read_manifest(head_sha)
          version_bumped = base_version != head_version
          initial_version_recorded = (
              "." not in base_manifest and head_manifest.get(".") == head_version
          )
          if base_package != head_package or not (version_bumped or initial_version_recorded):
              raise SystemExit(1)
          PY
              then
                metadata_only=false
              fi
            fi

            if [ "${metadata_only}" = "true" ]; then
              run_full=false
            fi
          fi

          echo "run_full=${run_full}" >> "${GITHUB_OUTPUT}"

  format:
    name: Format
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # Writes the user-level npmrc that reads NODE_AUTH_TOKEN; pnpm ignores
          # environment-backed auth in the repository .npmrc.
          registry-url: https://npm.pkg.github.com
          scope: '@echovisionlab'
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
      - name: Check Prettier formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z "${BASE_SHA}...${HEAD_SHA}"
          )
          if [ "${#changed_files[@]}" -gt 0 ]; then
            pnpm exec prettier --check --ignore-unknown -- "${changed_files[@]}"
          fi

  quality:
    name: Build and static checks
    needs: [scope, format]
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    # Keep the app build and static checks independent of the shared Storybook build.
    timeout-minutes: 45
    env:
      # Node sizes its default heap from runner memory (8 GB here), which is too
      # small for type-aware lint and the Next build.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Add swap to the hosted runner
        # Private repositories run on 2-core/8 GB hosted runners with a small disk.
        # The Next build and type-aware lint outgrow 8 GB and the runner is
        # OOM-killed mid-build, so drop preinstalled SDKs this job never uses and
        # size the swapfile to the space that leaves (keeping room for the build).
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          free_gb() { df --output=avail -BG "$1" 2>/dev/null | tail -1 | tr -dc 0-9 || true; }
          target=/ci-swapfile
          avail=$(free_gb /)
          if [ -d /mnt ] && [ "$(free_gb /mnt)" -gt "${avail:-0}" ]; then
            target=/mnt/ci-swapfile
            avail=$(free_gb /mnt)
          fi
          size=$(( ${avail:-0} - 12 ))
          [ "$size" -gt 10 ] && size=10
          if [ "$size" -ge 2 ]; then
            sudo fallocate -l "${size}G" "$target"
            sudo chmod 600 "$target"
            sudo mkswap "$target" >/dev/null
            sudo swapon "$target"
          else
            echo "::warning::not enough disk for extra swap (${avail:-0}G free)"
          fi
          free -h
          df -h /
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # Writes the user-level npmrc that reads NODE_AUTH_TOKEN; pnpm ignores
          # environment-backed auth in the repository .npmrc.
          registry-url: https://npm.pkg.github.com
          scope: '@echovisionlab'
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
      - name: Lint JavaScript and TypeScript
        env:
          # Type-aware lint of the whole app exceeds Node's default ~2 GB heap.
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm lint
      - name: Check translation catalogues against English and client message scopes
        run: pnpm i18n:check
      - name: Lint stylesheets
        run: pnpm lint:styles
      - name: Check design tokens and inventory freshness
        run: pnpm design-system:check
      - name: Test design-system enforcement
        run: pnpm design-system:test
      - name: Verify accepted and rejected Core presentation contracts
        run: pnpm design-system:typecheck
      - name: Check light and dark color contrast contracts
        run: pnpm design-system:test:contrast
      - name: Prepare MapLibre worker
        run: pnpm prepare:maplibre-worker
      - name: Prepare p5 runtime
        run: pnpm prepare:p5-runtime
      - name: Build with TypeScript 7
        run: pnpm build
      - name: Check per-route first-load client bundle budget
        run: pnpm perf:bundle

  storybook-build:
    name: Build Storybook
    needs: [scope, format]
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      # Reviewed renderer source, pinned to the merged API main commit.
      EMAIL_PREVIEW_API_REVISION: 7155b62b9be580753f2187ec85fb2b8eed9dcd94
    steps:
      - name: Require an immutable API renderer revision
        shell: bash
        run: '[[ "$EMAIL_PREVIEW_API_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@echovisionlab'
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Typecheck interactive preview sources
        run: pnpm storybook:typecheck
      - name: Prepare MapLibre worker
        run: pnpm prepare:maplibre-worker
      - name: Prepare p5 runtime
        run: pnpm prepare:p5-runtime
      - name: Build Storybook catalog once
        run: pnpm storybook:build --output-dir .artifacts/storybook-build/site
      - name: Checkout the reviewed email renderer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: echovisionlab/geul-api
          ref: ${{ env.EMAIL_PREVIEW_API_REVISION }}
          path: .artifacts/email-preview-api
          token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
          persist-credentials: false
      - name: Set up the API's Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .artifacts/email-preview-api/go.mod
          cache: true
          cache-dependency-path: .artifacts/email-preview-api/go.sum
      - name: Build the production email preview helpers once per target
        working-directory: .artifacts/email-preview-api
        env:
          TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
          GOWORK: 'off'
          GOPRIVATE: github.com/echovisionlab/*
        run: |
          set -euo pipefail
          : "${TOKEN:?Set the PRIVATE_DEPS_TOKEN repository secret}"
          config=$(mktemp "$RUNNER_TEMP/geul-storybook-email-deps.XXXXXX")
          trap 'rm -f "$config"' EXIT
          git config --file "$config" url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          export GIT_CONFIG_GLOBAL="$config"
          [ "$(git rev-parse HEAD)" = "$EMAIL_PREVIEW_API_REVISION" ]
          mkdir -p "$GITHUB_WORKSPACE/.artifacts/storybook-build/bin"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$GITHUB_WORKSPACE/.artifacts/storybook-build/bin/email-preview-fixture" ./cmd/email-preview-fixture
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o "$GITHUB_WORKSPACE/.artifacts/storybook-build/bin/email-preview-fixture-darwin-arm64" ./cmd/email-preview-fixture
          printf '%s\n' "$EMAIL_PREVIEW_API_REVISION" > "$GITHUB_WORKSPACE/.artifacts/storybook-build/api-revision.txt"
      - name: Share immutable browser-test build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-build
          path: .artifacts/storybook-build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  storybook-browser:
    name: Storybook (${{ matrix.suite }} ${{ matrix.index }}/${{ matrix.count }})
    needs: [scope, storybook-build]
    if: needs.scope.outputs.run_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: a11y
            index: 1
            count: 2
          - suite: a11y
            index: 2
            count: 2
          - suite: author
            index: 1
            count: 2
          - suite: author
            index: 2
            count: 2
          - suite: email-rendering
            index: 1
            count: 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@echovisionlab'
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Download the shared Storybook build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-build
          path: .artifacts/storybook-build
      - name: Restore the shared helper's executable permission
        run: chmod +x .artifacts/storybook-build/bin/email-preview-fixture
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run isolated stories on all available CI CPUs
        env:
          EMAIL_PREVIEW_FIXTURE_BINARY: ${{ github.workspace }}/.artifacts/storybook-build/bin/email-preview-fixture
        run: pnpm storybook:test:ci --suite ${{ matrix.suite }} --shard ${{ matrix.index }}/${{ matrix.count }} --static-dir .artifacts/storybook-build/site
      - name: Save browser results and context disposal evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-${{ matrix.suite }}-${{ matrix.index }}
          path: |
            .artifacts/storybook/**
            !.artifacts/storybook/**/cache/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          compression-level: 1

  unit:
    name: Tests (${{ matrix.project }} ${{ matrix.shard }})
    needs: [scope, format]
    if: needs.scope.outputs.run_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: node-unit
            shard: '1/1'
          - project: component
            shard: '1/2'
          - project: component
            shard: '2/2'
          - project: server-contract
            shard: '1/1'
          - project: editor-integration
            shard: '1/1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # Writes the user-level npmrc that reads NODE_AUTH_TOKEN; pnpm ignores
          # environment-backed auth in the repository .npmrc.
          registry-url: https://npm.pkg.github.com
          scope: '@echovisionlab'
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
      - name: Run test project shard
        run: pnpm exec vitest run --fileParallelism --project=${{ matrix.project }} --shard=${{ matrix.shard }}

  validate:
    name: Validate
    if: always()
    needs: [scope, format, quality, unit, storybook-build, storybook-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RUN_FULL: ${{ needs.scope.outputs.run_full }}
      SCOPE_RESULT: ${{ needs.scope.result }}
      FORMAT_RESULT: ${{ needs.format.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      UNIT_RESULT: ${{ needs.unit.result }}
      STORYBOOK_BUILD_RESULT: ${{ needs.storybook-build.result }}
      STORYBOOK_BROWSER_RESULT: ${{ needs.storybook-browser.result }}
    steps:
      - name: Require every applicable check
        shell: bash
        run: |
          set -euo pipefail
          [ "${SCOPE_RESULT}" = "success" ]
          if [ "${RUN_FULL}" = "true" ]; then
            [ "${FORMAT_RESULT}" = "success" ]
            [ "${QUALITY_RESULT}" = "success" ]
            [ "${UNIT_RESULT}" = "success" ]
            [ "${STORYBOOK_BUILD_RESULT}" = "success" ]
            [ "${STORYBOOK_BROWSER_RESULT}" = "success" ]
          else
            [ "${FORMAT_RESULT}" = "skipped" ]
            [ "${QUALITY_RESULT}" = "skipped" ]
            [ "${UNIT_RESULT}" = "skipped" ]
            [ "${STORYBOOK_BUILD_RESULT}" = "skipped" ]
            [ "${STORYBOOK_BROWSER_RESULT}" = "skipped" ]
          fi
