name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PNPM_VERSION: 11.22.0
  OATHKEEPER_URL: http://localhost:8000
  KRATOS_URL: http://localhost:4433
  KRATOS_ADMIN_URL: http://localhost:4434
  HYDRA_ADMIN_URL: http://localhost:4445
  MCP_OAUTH_ISSUER_URL: http://sso.localhost:4444
  SITE_ORIGIN: http://localhost:3000
  SESSION_COOKIE_NAME: site_session
  DRAFT_SECRET: build-time-placeholder-secret123
  ENCRYPTION_SECRET: build-time-placeholder-secret123
  HOST: localhost

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.classify.outputs.run_full }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Classify pull request changes
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          run_full=true

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] &&
             [[ "${HEAD_REF}" = release-please--* ]] &&
             [ -n "${BASE_SHA}" ] &&
             [ -n "${HEAD_SHA}" ]; then
            changed_files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
            metadata_only=true
            [ -n "${changed_files}" ] || metadata_only=false

            while IFS= read -r path; do
              case "${path}" in
                .release-please-manifest.json|CHANGELOG.md|package.json) ;;
                *) metadata_only=false ;;
              esac
            done <<< "${changed_files}"

            if [ "${metadata_only}" = "true" ]; then
              python3 - "${BASE_SHA}" "${HEAD_SHA}" <<'PY'
          import json
          import subprocess
          import sys

          base_sha, head_sha = sys.argv[1:]

          def read_package(revision: str) -> tuple[str, dict]:
              raw = subprocess.check_output(
                  ["git", "show", f"{revision}:package.json"], text=True
              )
              package = json.loads(raw)
              version = package.pop("version", None)
              if not isinstance(version, str):
                  raise SystemExit(1)
              return version, package

          base_version, base_package = read_package(base_sha)
          head_version, head_package = read_package(head_sha)
          if base_version == head_version or base_package != head_package:
              raise SystemExit(1)
          PY
            fi

            if [ "${metadata_only}" = "true" ]; then
              run_full=false
            fi
          fi

          echo "run_full=${run_full}" >> "${GITHUB_OUTPUT}"

  format:
    name: Format
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Prettier formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z "${BASE_SHA}...${HEAD_SHA}"
          )
          if [ "${#changed_files[@]}" -gt 0 ]; then
            pnpm exec prettier --check --ignore-unknown -- "${changed_files[@]}"
          fi

  quality:
    name: Build and static checks
    needs: [scope, format]
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint JavaScript and TypeScript
        run: pnpm lint
      - name: Lint stylesheets
        run: pnpm lint:styles
      - name: Prepare MapLibre worker
        run: pnpm prepare:maplibre-worker
      - name: Prepare p5 runtime
        run: pnpm prepare:p5-runtime
      - name: Build with TypeScript 7
        run: pnpm build
      - name: Build Storybook catalog
        run: pnpm storybook:build

  unit:
    name: Unit tests (${{ matrix.shard }}/2)
    needs: [scope, format]
    if: needs.scope.outputs.run_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit-test shard
        run: pnpm exec vitest run --fileParallelism --shard=${{ matrix.shard }}/2

  validate:
    name: Validate
    if: always()
    needs: [scope, format, quality, unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RUN_FULL: ${{ needs.scope.outputs.run_full }}
      SCOPE_RESULT: ${{ needs.scope.result }}
      FORMAT_RESULT: ${{ needs.format.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      UNIT_RESULT: ${{ needs.unit.result }}
    steps:
      - name: Require every applicable check
        shell: bash
        run: |
          set -euo pipefail
          [ "${SCOPE_RESULT}" = "success" ]
          if [ "${RUN_FULL}" = "true" ]; then
            [ "${FORMAT_RESULT}" = "success" ]
            [ "${QUALITY_RESULT}" = "success" ]
            [ "${UNIT_RESULT}" = "success" ]
          else
            [ "${FORMAT_RESULT}" = "skipped" ]
            [ "${QUALITY_RESULT}" = "skipped" ]
            [ "${UNIT_RESULT}" = "skipped" ]
          fi
